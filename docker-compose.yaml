services:
  dysyncengine:
    build: .
    image: ghcr.io/plsy1/dy_sync_engine:latest
    container_name: dysyncengine
    ports:
      - "80:80"
    volumes:
      # Persistent database folder
      - ./data:/app/backend/data
      # Downloaded videos/assets
      - ./videos:/app/videos
      # Platform config directory (auto-initialized on first start)
      # Cookie 和配置修改后重启容器生效，或在设置页面直接保存
      - ./config:/app/config
    environment:
      - PORT=80
      - PYTHONUNBUFFERED=1
      - SAVE_DIR=videos
    restart: unless-stopped
