name: CI Docker GHCR Build

on:
  push:
    branches:
      - main
    paths:
      - 'VERSION'
  workflow_dispatch:

jobs:
  metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      image: ghcr.io/${{ github.repository_owner }}/dy_sync_engine
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "VERSION=$(cat VERSION | tr -d '\n')" >> $GITHUB_OUTPUT

  docker-build:
    runs-on: ubuntu-latest
    needs: [metadata]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            ${{ needs.metadata.outputs.image }}:${{ needs.metadata.outputs.version }}-${{ matrix.suffix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-manifest:
    runs-on: ubuntu-latest
    needs: [metadata, docker-build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        run: |
          docker buildx imagetools create \
            -t ${{ needs.metadata.outputs.image }}:${{ needs.metadata.outputs.version }} \
            ${{ needs.metadata.outputs.image }}:${{ needs.metadata.outputs.version }}-amd64 \
            ${{ needs.metadata.outputs.image }}:${{ needs.metadata.outputs.version }}-arm64

          docker buildx imagetools create \
            -t ${{ needs.metadata.outputs.image }}:latest \
            ${{ needs.metadata.outputs.image }}:${{ needs.metadata.outputs.version }}-amd64 \
            ${{ needs.metadata.outputs.image }}:${{ needs.metadata.outputs.version }}-arm64

  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [metadata, docker-manifest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.metadata.outputs.version }}
          name: Release v${{ needs.metadata.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

